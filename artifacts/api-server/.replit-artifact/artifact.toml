kind = "api"
previewPath = "/"
title = "Ask WEKA"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8000
name = "Ask WEKA"
paths = ["/"]

[services.development]
run = "cd ../.. && bash start.sh"

[services.production]

[services.production.build]
args = ["bash", "-c", "cd frontend && npm ci --no-audit --no-fund && npm run build"]

[services.production.run]
args = ["bash", "-c", "uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8000}"]

[services.production.run.env]
PORT = "8000"

[services.production.health.startup]
path = "/api/healthz"
