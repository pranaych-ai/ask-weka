name: Secret Scan

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, all refs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -C /tmp -xzf /tmp/gitleaks.tgz gitleaks
          /tmp/gitleaks version

      - name: Scan full repository history (redacted output)
        run: |
          set -euo pipefail
          git fetch --tags origin '+refs/heads/*:refs/remotes/origin/*'
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --exit-code 1

      - name: Scan working tree
        run: |
          set -euo pipefail
          /tmp/gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1
